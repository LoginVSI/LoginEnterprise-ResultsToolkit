apiVersion: 1
datasources:
  - name: LE-Influx3
    uid: leinflux
    type: influxdb
    access: proxy
    # Use https and a CA you trust. Do not set tlsSkipVerify.
    url: https://localhost:8181
    jsonData:
      version: SQL
      dbName: leproof
      httpMode: POST
      insecureGrpc: false
      tlsAuthWithCACert: true
    secureJsonData:
      # Grafana expands environment variables in provisioning files. Keep the token out of this file.
      token: ${INFLUXDB3_TOKEN}
      # Paste the public CA certificate (PEM) that signed the InfluxDB server certificate.
      tlsCACert: |
        -----BEGIN CERTIFICATE-----
        replace with your CA certificate
        -----END CERTIFICATE-----
