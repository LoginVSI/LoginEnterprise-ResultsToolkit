name: Offline preview checks
on:
  push:
    branches: [main, feat/results-toolkit-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python scripts/check_public_content.py
      - run: python -m pip_audit --local --skip-editable
      - run: python -m build --wheel --outdir artifacts/wheels
      - run: python scripts/installation_smoke.py --external
      - run: le-results demo --out artifacts/walkthrough
      - run: le-results compare --baseline artifacts/walkthrough/baseline --candidate artifacts/walkthrough/candidate --config artifacts/walkthrough/compare.json --out artifacts/walkthrough/comparison.json
      - run: le-results report --comparison artifacts/walkthrough/comparison.json --out artifacts/walkthrough/report
      - run: python scripts/validate_powerbi.py artifacts/walkthrough/report
      - run: le-results report-live --config examples/live-report.json --out artifacts/live-report
      - run: python scripts/validate_powerbi.py artifacts/live-report
      - run: le-results report-live --config examples/continuous-selected-report.json --out artifacts/selected-live-report
      - run: python scripts/validate_powerbi.py artifacts/selected-live-report
      - run: le-results export-line-protocol --capture artifacts/walkthrough/baseline --out artifacts/line-protocol
      - run: python -m venv --system-site-packages .venv
        if: runner.os == 'Windows'
      - run: powershell.exe -NoProfile -File scripts/Invoke-LEResults.ps1 verify artifacts/walkthrough/baseline
        if: runner.os == 'Windows'
      - run: pwsh -NoProfile -File scripts/Invoke-LEResults.ps1 verify artifacts/walkthrough/baseline
        if: runner.os == 'Windows'
      - run: powershell.exe -NoProfile -File scripts/Test-LEResultsReadiness.ps1
        if: runner.os == 'Windows'
      - run: pwsh -NoProfile -File scripts/Test-LEResultsReadiness.ps1
        if: runner.os == 'Windows'
  power-query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: le-results report-live --config examples/live-report.json --out artifacts/live-report
      - run: le-results report-live --config examples/continuous-report.json --out artifacts/continuous-report
      - run: le-results report-live --config examples/continuous-selected-report.json --out artifacts/selected-live-report
      - run: npm ci --ignore-scripts --prefix scripts/powerquery-validation
      - run: node scripts/validate_m.cjs scripts/powerquery-validation adapters/powerbi/ResultsToolkit.pq artifacts/live-report/Acquisition.pq artifacts/continuous-report/Acquisition.pq artifacts/selected-live-report/Acquisition.pq
