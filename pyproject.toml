[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "loginenterprise-results-toolkit"
version = "0.1.0a1"
description = "Unsupported community preview for repeatable Login Enterprise result evidence and reports"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<0.29", "keyring>=25.6,<26", "platformdirs>=4.3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "jsonschema>=4.23,<5", "build>=1.2,<2", "pip-audit>=2.8,<3", "pypdf>=6,<7"]

[project.scripts]
le-results = "le_results.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/le_results"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
